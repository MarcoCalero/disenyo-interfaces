<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Bootstrap CSS -->
    <link href="bootstrap/bootstrap.min.css" rel="stylesheet" />
    <!-- Estilos propios -->
    <link href="css/estilos.css" rel="stylesheet" />

    <!-- <a href="https://www.flaticon.es/iconos-gratis/emparedado" title="emparedado iconos">Emparedado iconos creados por Creaticca Creative Agency - Flaticon</a> -->

    <title>Bar</title>
  </head>

  <body>
    <div class="container">
      <!-- Barra de navegación -->
      <nav
        class="navbar navbar-expand-lg bg-gradient bg-light bg-gradient-directional"
      >
        <div class="container-fluid">
          <a class="navbar-brand">Bar <img src="favicon.png" width="25" /></a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="#" id="mnuAltaPedido"
                  >Alta de pedido</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#" id="mnuListadoPedidosCliente"
                  >Listado de pedidos de un cliente</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <!-- Formularios -->
      <form name="frmAltaPedido" id="frmAltaPedido" class="d-none">
        <!-- Incluir aquí los campos necesarios -->
        <h3>Alta de pedido</h3>
        <table>
          <tr>
            <td><p>Nombre del cliente:</p></td>
            <td>
              <div class="form-floating mb-3">
                <input
                  type="email"
                  class="campoNombreCliente"
                  id="floatingInput"
                  placeholder="name@example.com"
                />
                <label for="floatingInput">Nombre del cliente</label>
              </div>
            </td>
          </tr>
          <tr>
            <td>
              <p>Platos</p>
            </td>
            <td>
              <div class="row mb-3">
                <label for="lstGenero" class="col-3 form-label">Género</label>
                <div class="col-3">
                  <select class="form-select" name="lstGenero" id="lstPlato">
                    <!-- Rellenar desplegable de géneros -->
                  </select>
                </div>
              </div>
            </td>
          </tr>
          <tr>
            <td>
              <p>Unidades</p>
            </td>
            <td>
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radio1"
                checked
              />
              <label class="form-check-label" for="radioDefault1"> 1 </label>
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radio2"
              />
              <label class="form-check-label" for="radioDefault1"> 2 </label>
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radio3"
              />
              <label class="form-check-label" for="radioDefault1"> 3 </label>
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radio4"
              />
              <label class="form-check-label" for="radioDefault1"> 4 </label>
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radio5"
              />
              <label class="form-check-label" for="radioDefault1"> 5 </label>
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radio6"
              />
              <label class="form-check-label" for="radioDefault1"> 6 </label>
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radio7"
              />
              <label class="form-check-label" for="radioDefault1"> 7 </label>
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radio8"
              />
              <label class="form-check-label" for="radioDefault1"> 8 </label>
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radio9"
              />
              <label class="form-check-label" for="radioDefault1"> 9 </label>
            </td>
          </tr>
          <tr>
            <td>
              <button type="button" class="btn btn-primary" id="idboton">
                aceptar
              </button>
            </td>
          </tr>
        </table>
      </form>
      <form
        name="frmListadoPedidosCliente"
        id="frmListadoPedidosCliente"
        class="d-none"
      >
        <fieldset>
          <!-- Form Name -->
          <legend>Listado de pedidos de un cliente</legend>
          <!-- Text input-->
          <div class="row mb-1">
            <label class="col-3 control-label" for="txtNombreClienteListado"
              >Nombre del cliente</label
            >
            <div class="col-4">
              <input
                id="txtNombreClienteListado"
                name="txtNombreClienteListado"
                placeholder="Nombre del cliente"
                class="form-control input-md"
                type="text"
                step="1"
              />
            </div>
          </div>
          <!-- Button -->
          <div class="row mt-3">
            <div class="offset-3 col-4">
              <input
                type="button"
                id="btnListadoPedidosCliente"
                name="btnListadoPedidosCliente"
                class="btn btn-primary"
                value="Aceptar"
              />
            </div>
          </div>
        </fieldset>
      </form>

      <!-- Listado -->
      <div id="listado">
        <!-- Mostrar aquí la tabla del listado solicitado -->
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="bootstrap/bootstrap.min.js"></script>
    <!-- Scripts propios -->
    <script src="js/ajax.js"></script>
    <script src="js/objetos.js"></script>
    <script src="js/codigo.js"></script>
  </body>
</html>
